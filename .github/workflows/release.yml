name: Release

# Step two of the release, and fully automatic. release-pr.yml opens the
# "chore(main): release X.Y.Z" pull request by hand; merging it is the release
# decision, and this workflow is what that merge triggers: release-please tags
# the merge commit, the three runners build their native artifacts, and the
# draft release is filled in and published.
#
# It runs on every push to main but is a no-op — a few seconds — unless the
# pushed commit is a merged release PR. The tagging half cannot be manual:
# release-please only recognises a merged release PR while looking at a push
# to main, so a dispatch-only design would leave PRs merged but never tagged.
#
# One workflow, deliberately: a tag pushed with GITHUB_TOKEN does not fire
# `on: push: tags`, so splitting the build out would require a PAT.
#
# The release PR is an ordinary pull request, so ci.yml has already run lint,
# unit tests, build and E2E on all three platforms against this exact tree.
# That is what the local `npm run release` guards used to buy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never cancel a release in flight: a cancelled run leaves a tag and a draft
# release with no artifacts attached to it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Tags and creates the release when the pushed commit is a merged
      # release PR; does nothing otherwise. PR management belongs to
      # release-pr.yml, so it is skipped here.
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Build the tagged commit, not whatever main points at by the time
          # this job starts.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build and package (unsigned)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: ignore

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      # release-please creates the release as a draft (see
      # release-please-config.json) so that a release is never visible without
      # its binaries — the tag exists minutes before the builds finish. Attach
      # the artifacts first, then publish.
      - name: Attach artifacts and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  homebrew-bump:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    steps:
      - id: shasums
        name: Compute dmg sha256
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          arm_sha=$(curl -fsSL "$BASE/Keycache-$VERSION-arm64.dmg" | sha256sum | awk '{print $1}')
          x64_sha=$(curl -fsSL "$BASE/Keycache-$VERSION-x64.dmg"   | sha256sum | awk '{print $1}')
          echo "arm_sha=$arm_sha" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$x64_sha" >> "$GITHUB_OUTPUT"

      - name: Check out tap repo
        uses: actions/checkout@v7.0.1
        with:
          repository: moreiraeugenio/homebrew-keycache
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          # Don't leave `http.<host>.extraheader` in the tap clone's git
          # config — peter-evans/create-pull-request adds its own Authorization
          # header and the two collide as "Duplicate header: Authorization".
          persist-credentials: false

      - name: Update cask
        working-directory: tap
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ARM_SHA: ${{ steps.shasums.outputs.arm_sha }}
          X64_SHA: ${{ steps.shasums.outputs.x64_sha }}
        run: |
          sed -i -E "s/version \"[^\"]+\"/version \"$VERSION\"/"  Casks/keycache.rb
          sed -i -E "s|arm:   \"[a-f0-9]+\"|arm:   \"$ARM_SHA\"|" Casks/keycache.rb
          sed -i -E "s|intel: \"[a-f0-9]+\"|intel: \"$X64_SHA\"|" Casks/keycache.rb

      - name: Open PR on tap repo
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit-message: "keycache ${{ needs.release-please.outputs.version }}"
          branch: bump-keycache-${{ needs.release-please.outputs.version }}
          title: "keycache ${{ needs.release-please.outputs.version }}"
          body: |
            Auto-bump from [moreiraeugenio/keycache@${{ needs.release-please.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag }}).
