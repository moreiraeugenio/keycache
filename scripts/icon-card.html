<!doctype html>
<!--
  Source for site/assets/icon.png — the favicon and apple-touch-icon for
  keycache.app. build/icon.png (the app icon) is a black key on transparency,
  which disappears against a dark browser tab strip, so the web icon puts it
  on the brand tile instead. Rendered by `npm run site:images`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 512px;
        height: 512px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d9488;
        overflow: hidden;
      }

      img {
        width: 300px;
        height: 300px;
        filter: invert(1);
      }
    </style>
  </head>
  <body>
    <img src="../build/icon.png" alt="" />
  </body>
</html>
